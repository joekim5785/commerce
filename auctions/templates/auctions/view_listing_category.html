
{% extends "auctions/layout.html" %}

{% block body %}
    <h1>{{listing.category}}</h1>
    {% for listing in listings %}
        <div class="container mt-4">

            

            <div class="card mb-4 listing-card">

                <div class="row no-gutters">

                    <div class="col-md-4">
                        {% if listing.image %}
                            <img src="{{ listing.image }}"
                                 class="card-img listing-image"
                                 alt="{{ listing.title }}">
                        {% endif %}
                    </div>

                    <div class="col-md-8">

                        <div class="card-body">

                            <h4 class="card-title listing-title">
                                <a href="{% url 'listing' id=listing.id %}">{{ listing.title}}</a>
                            </h4>

                            <p class="card-text listing-description">
                                {{ listing.description }}
                            </p>


                            <p class="starting-bid">
                                ${{ listing.starting_bid }}
                            </p>
                            <p>
                                <a href="{% url 'AddToWatchlist' id=listing.id %}">Add To Watchlist</a>
                            </p>

                        </div>

                    </div>

                </div>

            </div>



        </div>

    {%endfor%}

{% endblock %}
